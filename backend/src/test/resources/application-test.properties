# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (disabled in tests)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only-minimum-256-bits-required-for-hs256-algorithm
jwt.expiration=3600000

# Logging
logging.level.root=WARN
logging.level.com.brewalgo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Disable Actuator Security for Tests
management.security.enabled=false
management.endpoints.web.exposure.include=*

# Cache Configuration (Simple for tests)
spring.cache.type=simple

# Disable Rate Limiting in Tests
rate.limit.enabled=false
